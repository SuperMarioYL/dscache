name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install
        # ubuntu-latest's system interpreter is PEP 668 externally-managed;
        # without this flag `uv pip install --system` fails with "The
        # interpreter at /usr is externally managed".
        run: uv pip install --system --break-system-packages -e ".[dev]"
      - name: Test
        run: pytest -q
