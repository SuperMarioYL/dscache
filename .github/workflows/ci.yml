name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install
        # Install into a uv venv, not the system interpreter: ubuntu-latest's
        # system Python is PEP 668 externally-managed ("The interpreter at
        # /usr is externally managed") AND its dist-packages dir is root-owned
        # (Permission denied), so `--system` installs fail either way.
        run: |
          uv venv
          uv pip install -e ".[dev]"
      - name: Test
        run: .venv/bin/pytest -q
