name: release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - name: Build wheel + sdist
        # Build in a uv venv, not the system interpreter: ubuntu-latest's
        # system Python is PEP 668 externally-managed AND its dist-packages
        # dir is root-owned, so `--system` installs fail either way.
        run: |
          uv venv
          uv pip install build
          .venv/bin/python -m build --outdir dist
      - name: Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
